name: claudefolder # pinned: compose project name defaults to the folder name, so renaming the
# folder (as happened once already) would spin up a second empty db/volume
# instead of reusing the real one. Keep this pinned to whatever it already is.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rta
      POSTGRES_PASSWORD: rta_dev_password
      POSTGRES_DB: real_time_assistant
    ports:
      - "5433:5432"
    volumes:
      - rta_pgdata:/var/lib/postgresql/data

volumes:
  rta_pgdata:
